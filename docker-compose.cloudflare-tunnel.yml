# Dedicated Cloudflare Tunnel front door. Activate only through install.sh
# --cloudflare-tunnel; the installer persists this file alongside docker-compose.yml in
# COMPOSE_FILE so later `scripts/compose.sh` operations retain the same loopback-only boundary.
services:
  caddy:
    ports: !override
      - "127.0.0.1:18080:80"
    volumes: !override
      - ./infra/Caddyfile.cloudflare-tunnel:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
